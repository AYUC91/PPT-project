<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT 部門週報 (自動同步版)</title>
    <style>
        /* --- 新增：修正邊距把寬度撐破的問題 --- */
        * {
            box-sizing: border-box;
        }

        /* 網頁深色背景設定 */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* 科技感深藍色 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #cbd5e1;
        }

        /* 讓簡報保持 16:9 比例並隨螢幕縮放 */
        .presentation-wrapper {
            position: relative;
            width: 90%;
            max-width: 1280px;
            padding-bottom: 56.25%; /* 16:9 比例 */
            height: 0;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 強制 iframe 填滿外框 */
        .presentation-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #fff; /* 避免載入時透明 */
        }

        /* --- 新增：控制按鈕區域 --- */
        .controls-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            z-index: 10;
        }

        .action-btn {
            background-color: #1e293b;
            color: #e0f2fe;
            border: 1px solid #38bdf8;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .action-btn.primary {
            background-color: #0ea5e9;
            color: #fff;
            border-color: #0ea5e9;
        }

        .action-btn.primary:hover {
            background-color: #0284c7;
        }

        /* --- 新增：頂部選單樣式 --- */
        .header-container {
            width: 90%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e293b;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .report-selector {
            padding: 10px 15px;
            background-color: #0f172a;
            color: #e0f2fe;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            max-width: 300px;
        }

        /* --- 新增：手機版專屬優化 (RWD) --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 20px;
                overflow-x: hidden; /* 新增：防止畫面左右亂跑 */
            }

            .header-container {
                flex-direction: column;
                gap: 15px;
                width: 100%;
                border-radius: 0;
                border-left: none;
                border-right: none;
                margin-bottom: 0;
                padding: 15px; /* 縮小手機版內邊距 */
            }

            .report-selector {
                width: 100%;
                max-width: 100%;
            }

            .presentation-wrapper {
                width: 100%; /* 手機上取消左右留白，放到最大 */
                border-radius: 0;
                border-left: none;
                border-right: none;
            }

            .controls-container {
                flex-direction: column;
                width: 90%;
                margin-top: 20px;
                margin-bottom: 40px; /* 新增：底部留白，避免被手機瀏覽器底下的工具列擋住 */
            }

            .action-btn {
                width: 100%;
                justify-content: center;
                padding: 16px; /* 加大按鈕方便手指點擊 */
                font-size: 18px;
            }

            .mobile-hint {
                display: block;
                text-align: center;
                color: #94a3b8;
                font-size: 14px;
                margin-top: 10px;
                width: 90%;
            }
        }

        @media (min-width: 769px) {
            .mobile-hint {
                display: none;
            }
            body {
                flex-direction: column;
            }
        }
        /* 隱藏區塊用 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 頂部切換選單 -->
    <div class="header-container">
        <div class="header-title">
            <svg width="24" height="24" fill="none" stroke="#0ea5e9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            IT 部門週報系統
        </div>
        <select class="report-selector" id="report-selector" onchange="changeReport()">
            <!-- ⬇️ 以後每週有新簡報，請把發佈後取得的「新網址」貼到 value="裡面"，並修改顯示文字 ⬇️ -->
            
            <option value="https://docs.google.com/presentation/d/e/2PACX-1vQPGBZjerfDDv9BVRBtJbe-C3qUayd6ZOuXfElY86a-0Z0NqW3mYwdRh8yQw0M3MriKgx1Ug4nyKbMH/pubembed?start=false&loop=false&delayms=3000">2026/05/04 週報 (最新)</option>
            <option value="https://docs.google.com/presentation/d/e/2PACX-1vQ3NHNMHdaWbppZMF-T1Wi3z7z52iWtpLCJ1KWzvAHRpaVnlJ4f_HURqaaTETOillqbHRgQiTXc6Hay/pubembed?start=false&loop=false&delayms=3000">2026/04/24 週報</option>
            
            <!-- 歷史週報 -->
            <option value="請在這裡貼上04/17簡報的發佈網址">2026/04/17 週報</option>
            <option value="請在這裡貼上04/10簡報的發佈網址">2026/04/10 週報</option>
        </select>
    </div>

    <!-- 直接展示你的專屬簡報 -->
    <div class="presentation-wrapper" id="slide-container">
        <iframe id="google-slide" src="https://docs.google.com/presentation/d/e/2PACX-1vQ3NHNMHdaWbppZMF-T1Wi3z7z52iWtpLCJ1KWzvAHRpaVnlJ4f_HURqaaTETOillqbHRgQiTXc6Hay/pubembed?start=false&loop=false&delayms=3000" frameborder="0" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
    </div>

    <!-- 操作按鈕列 -->
    <div class="controls-container">
        <button class="action-btn primary" onclick="openFullscreen()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            放大全螢幕
        </button>
        <button class="action-btn" onclick="openNewTab()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            獨立視窗開啟
        </button>
    </div>
    
    <div class="mobile-hint">
        💡 建議：點擊「放大全螢幕」並將手機<b>轉為橫向</b>以獲得最佳閱讀體驗。
    </div>

    <script>
        // 切換不同週報的功能：一旦選單改變，就會自動抓取 value 的網址並載入 iframe
        function changeReport() {
            const selector = document.getElementById("report-selector");
            const iframe = document.getElementById("google-slide");
            
            // 如果網址還沒填寫，給個小提示
            if (selector.value.includes("請在這裡貼上")) {
                alert("這個週期的簡報網址還沒設定喔！請先至 GitHub 編輯程式碼加入正確連結。");
            } else {
                iframe.src = selector.value;
            }
        }

        // 頁面載入時，自動切換到選單中第一個選項的網址
        window.onload = function() {
            const selector = document.getElementById("report-selector");
            const iframe = document.getElementById("google-slide");
            if (!selector.value.includes("請在這裡貼上")) {
                iframe.src = selector.value;
            }
        };

        // 全螢幕功能
        function openFullscreen() {
            const elem = document.getElementById("slide-container");
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // 在新分頁開啟（將 pubembed 改為 pub，畫面會更乾淨）
        function openNewTab() {
            const iframe = document.getElementById("google-slide");
            const rawUrl = iframe.src;
            if (rawUrl.includes("請在這裡貼上")) {
                alert("網址尚未設定");
                return;
            }
            // 轉換連結格式以獲得最佳的全螢幕獨立視窗體驗
            const cleanUrl = rawUrl.replace('/pubembed', '/pub');
            window.open(cleanUrl, '_blank');
        }
    </script>
</body>
</html>
